name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          mkdir -p project
          unzip -q WeeklyPlannerAndroid_AI_Reminder_Project.zip -d project
          if [ -d project/WeeklyPlannerAndroid_AI_Reminder_Project ]; then
            shopt -s dotglob
            mv project/WeeklyPlannerAndroid_AI_Reminder_Project/* project/
            rmdir project/WeeklyPlannerAndroid_AI_Reminder_Project
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planner-ai-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
